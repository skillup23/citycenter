# Конфиг nginx для www.citycenter.ru — замена /etc/nginx/sites-enabled/default
# Пути к сертификатам — те же, что выпустил Certbot. Перед заменой проверьте,
# что сертификат покрывает и citycenter.ru, и www.citycenter.ru: `certbot certificates`.

server_tokens off;

# http → https://www (один редирект, без цепочек)
server {
    listen 80;
    listen [::]:80;
    server_name citycenter.ru www.citycenter.ru;
    return 301 https://www.citycenter.ru$request_uri;
}

# https без www → https://www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name citycenter.ru;

    ssl_certificate /etc/letsencrypt/live/citycenter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citycenter.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.citycenter.ru$request_uri;
}

# Основной сайт
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.citycenter.ru;

    ssl_certificate /etc/letsencrypt/live/citycenter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citycenter.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Браузер год открывает сайт только по https
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    # Файлы сборки Next.js с хешем в имени — можно кэшировать год
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
